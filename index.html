<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="eye-slash-solid.svg" type="image/svg+xml" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="container">
      <form>
        <i class="fas fa-paper-plane"></i>

        <div class="input-group">
          <label>Full Name</label>
          <input
            type="text"
            placeholder="Enter your name"
            id="contect-name"
            onkeyup="validateName()" />
          <span id="name-error"></span>
        </div>

        <div class="input-group">
          <label>Phone No.</label>
          <input
            type="tel"
            placeholder="123 456 7890"
            id="contect-phone"
            onkeyup="validatePhone()" />
          <span id="phone-error"> </span>
        </div>

        <div class="input-group">
          <label>Email Id</label>
          <input
            type="email"
            placeholder="Enter Email"
            id="contect-email"
            onkeyup="validateEmail()" />
          <span id="email-error"> </span>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="Enter Password"
            id="contect-password"
            onkeyup="validatePassword()" />
          <i class="fa-solid fa-eye-slash pass-icone" id="eyeClose"></i>
          <span id="password-error"> </span>
        </div>
        <div class="input-group">
          <label>Your Message</label>
          <textarea
            rows="5"
            placeholder="Enter your message"
            id="contect-message"
            onkeyup="validateMessage()"></textarea>
          <span id="message-error"> </span>
        </div>

        <button onclick="return validateForm();">Submit</button>
        <span id="submit-error"> </span>
      </form>
    </div>
    <footer class="footer">
      <p>
        &copy; 2025 Form Validation. Designed and developed by Vyom Patel. All
        rights reserved.
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
